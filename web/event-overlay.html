<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/common.css"><title>Event Overlay</title><style>
body{position:relative;width:100vw;height:100vh;overflow:hidden}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.callout{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.94);min-width:560px;max-width:1050px;text-align:center;opacity:0;transition:.22s ease;pointer-events:none}.callout.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.eyebrow{font-size:18px;font-weight:900;letter-spacing:6px;color:var(--cyan);text-transform:uppercase}.headline{font-size:76px;line-height:.95;font-weight:1000;letter-spacing:-2px;text-shadow:0 6px 30px rgba(0,0,0,.75)}.subline{font-size:24px;color:#c9d5e6;margin-top:12px}.boss{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(860px,75vw);text-align:center;display:none}.boss.on{display:block} .boss.major .monsterStage{height:300px}.boss.major .bossName{font-size:38px}.monsterStage{height:240px;position:relative;display:flex;align-items:center;justify-content:center;margin:auto}.monsterStage::before{content:'';position:absolute;width:70%;height:70%;border-radius:50%;background:radial-gradient(ellipse,rgba(176,116,255,.26),transparent 70%);filter:blur(12px)}.monster{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(122,155,255,.4));animation:monsterIdle 2.8s ease-in-out infinite;position:relative}.monster.hit{animation:monsterHit .22s ease-in-out}.monsterLoad{position:absolute;bottom:6px;left:0;right:0;font-size:16px;color:#c9d5e6}.damageNumber{position:absolute;font-size:36px;font-weight:1000;color:#ffe58b;text-shadow:0 2px 6px #000;pointer-events:none;z-index:8;animation:damageFloat .85s ease-out forwards}.battleHint{font-size:16px;margin-top:12px;color:#b8cae4}.callout.battleNotice{top:8%;min-width:0;width:90%;max-width:1100px;padding:8px 14px;background:rgba(8,12,22,.85);border-radius:15px}.battleNotice .headline{font-size:30px;letter-spacing:1px}.battleNotice .eyebrow{font-size:12px;letter-spacing:3px}.battleNotice .subline{font-size:16px;margin-top:5px}@keyframes monsterIdle{0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}50%{transform:translateY(-9px) rotate(1deg) scale(1.025)}}@keyframes monsterHit{0%,100%{transform:translateX(0);filter:brightness(1)}30%{transform:translateX(-8px) rotate(-2deg);filter:brightness(2) drop-shadow(0 0 22px #ff536a)}65%{transform:translateX(6px)}}@keyframes damageFloat{from{opacity:1;transform:translateY(0) scale(.8)}25%{transform:translateY(-16px) scale(1.2)}to{opacity:0;transform:translateY(-75px) scale(1)}}
.bossName{font-size:46px}.orb{width:160px;height:160px;margin:auto;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 4%,#8d67ff 5% 20%,#26335a 48%,#090d17 72%);border:2px solid rgba(255,255,255,.4);box-shadow:0 0 55px rgba(89,216,255,.38);position:relative;transition:transform .08s}.orb.hit{transform:scale(.9) rotate(-2deg)}.orb::after{content:'';position:absolute;inset:20%;border-radius:50%;border:3px solid rgba(255,255,255,.25);animation:pulse 1.4s infinite}.bossName{font-size:30px;font-weight:950;margin-top:15px;letter-spacing:2px}.hpbar{height:26px;border:1px solid rgba(255,255,255,.25);border-radius:15px;background:rgba(0,0,0,.5);overflow:hidden;margin:10px auto 0;max-width:720px}.hpfill{height:100%;background:linear-gradient(90deg,#ff536a,#ff9c5d);transition:width .2s}.bossMeta{display:flex;justify-content:center;gap:28px;margin-top:8px;font-weight:800;color:#c7d3e4}.assist{margin:12px auto 0;max-width:520px}.assistHead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800}.assistTrack{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.assistFill{height:100%;background:linear-gradient(90deg,#4fc3ff,#5cff9b);transition:width .2s}.top3{position:absolute;right:36px;top:40px;min-width:260px;padding:12px 14px;border-radius:14px;display:none}.top3.on{display:block}.top3 h3{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:2px}.top3 div{display:flex;justify-content:space-between;font-weight:800;padding:3px 0}.projectile{position:absolute;width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,255,255,.8));pointer-events:none;z-index:5;transition:transform .52s cubic-bezier(.2,.8,.3,1),opacity .52s}.sim{position:absolute;left:24px;top:20px;font-size:11px;font-weight:900;padding:5px 9px;border-radius:999px;background:var(--orange);color:#111;display:none}.sim.on{display:block}.shake{animation:shake .18s linear}@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 6px),calc(-50% + 2px))}75%{transform:translate(calc(-50% + 5px),calc(-50% - 2px))}}
</style></head><body><canvas id="fx"></canvas><div id="sim" class="sim">SIMULATION MODE</div><div id="callout" class="callout"><div id="eye" class="eyebrow"></div><div id="head" class="headline"></div><div id="sub" class="subline"></div></div><div id="boss" class="boss"><div id="orb" class="monsterStage"><img id="monster" class="monster" alt="Bossmonster"><div id="monsterLoad" class="monsterLoad">Monster wird geladen…</div></div><div id="bossName" class="bossName">BOSS</div><div class="hpbar"><div id="hpfill" class="hpfill"></div></div><div class="bossMeta"><span><span id="hp">0</span>/<span id="maxhp">0</span> HP</span><span id="timer">0s</span><span id="people">0 Teilnehmer</span></div><div class="assist"><div class="assistHead"><span>RIDER ASSIST</span><span id="assistBonus">+0s</span></div><div class="assistTrack"><div id="assistFill" class="assistFill"></div></div></div><div class="battleHint">Deine Emotes greifen an · Twitch / 7TV / BTTV · 1 Damage, Subs 2×</div></div><div id="top3" class="top3 glass"><h3>LIVE DAMAGE</h3><div id="toprows"></div></div>
<script type="module">
import{connect,fmt,qs}from'/static/common.js';let state=null,lastEventId='',monsterId='',lastHitAt=0,bossHideTimer=null,displayedFightId='';const c=qs('#fx'),ctx=c.getContext('2d'),sparks=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function burst(x,y,n=30){for(let i=0;i<n;i++)sparks.push({x,y,vx:(Math.random()-.5)*500,vy:(Math.random()-.5)*500,a:1,s:1+Math.random()*4})}let lt=performance.now();function frame(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.a-=dt*1.8;if(p.a<=0){sparks.splice(i,1);continue}ctx.globalAlpha=p.a;ctx.fillStyle='#9ee9ff';ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
const labels={MILESTONE_10:['DISTANCE','KM!'],MILESTONE_100:['MEILENSTEIN','KM'],GOAL_COMPLETE:['CHALLENGE COMPLETE','1000 KM!'],BACK_ON_TRACK:['STATUS','BACK ON TRACK'],SUB_SPRINT:['5 SUB GIFT','SPRINT +30s'],SUB_CLIMB_1:['10 SUB GIFT','CLIMB 1%'],SUB_CLIMB_2_STANDING:['15 SUB GIFT','2% + STANDING'],RAID_STANDING:['RAID','STANDING'],BOSS_INCOMING:['WARNING','BOSS INCOMING'],BOSS_DEFEATED:['VICTORY','BOSS DEFEATED'],BOSS_ESCAPED:["TIME'S UP",'BOSS ESCAPED'],BOSS_HEAL:['MEDIPAK','+TIME'],RIDER_BOOST:['RIDER ASSIST','BOOST']};
function renderState(s){state=s;qs('#sim').classList.toggle('on',!!s.simulation);const enabled=s.features?.central_event_overlay!==false;document.body.style.visibility=enabled?'visible':'hidden';const b=s.boss,el=qs('#boss');if(b){displayedFightId=b.fight_id;clearTimeout(bossHideTimer);el.classList.add('on');el.classList.toggle('major',b.boss_type==='major');if(monsterId!==b.monster_id){monsterId=b.monster_id;const image=qs('#monster'),loading=qs('#monsterLoad');loading.textContent='Monster wird geladen…';loading.hidden=false;image.onload=()=>loading.hidden=true;image.onerror=()=>{loading.textContent='Monsterbild fehlt – bitte static/monsters vollständig kopieren'};image.src='/static/monsters/'+encodeURIComponent(monsterId)+'.png';image.alt=b.monster_name||'Bossmonster'}qs('#bossName').textContent=(b.monster_name||'BOSS').toUpperCase()+(b.boss_type==='major'?' · MEGA':'')+(b.km_mark?' // '+b.km_mark+' KM':'');qs('#hp').textContent=b.hp;qs('#maxhp').textContent=b.start_hp;qs('#hpfill').style.width=Math.max(0,b.hp_percent)+'%';qs('#timer').textContent=Math.ceil(b.remaining_s)+'s';qs('#people').textContent=b.participant_count+' Teilnehmer';qs('#assistFill').style.width=Math.min(100,b.rider_charge||0)+'%';qs('#assistBonus').textContent='+'+Math.round(b.rider_bonus_s||0)+'s';const top=qs('#top3');top.classList.toggle('on',(b.top3||[]).length>0);qs('#toprows').innerHTML=(b.top3||[]).map((p,i)=>`<div><span>${i+1}. ${esc(p.display_name||p.login||p.user_id)}</span><span>${p.damage}</span></div>`).join('')}else{clearTimeout(bossHideTimer);const hide=()=>{el.classList.remove('on');qs('#top3').classList.remove('on')};const delay=Math.max(0,850-(performance.now()-lastHitAt));if(delay)bossHideTimer=setTimeout(hide,delay);else hide()}
const ev=s.event,co=qs('#callout');if(ev&&ev.event_id!==lastEventId){lastEventId=ev.event_id;showCallout(ev)}else if(!ev)co.classList.remove('on')}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showCallout(ev){qs('#callout').classList.toggle('battleNotice',!!state?.boss||ev.type.startsWith('BOSS_'));const [eye,base]=labels[ev.type]||['EVENT',ev.type];let head=base,sub='';const p=ev.payload||{};if(ev.type==='MILESTONE_10')head=(p.mark_km||'')+' KM!';if(ev.type==='MILESTONE_100')head=(p.mark_km||'')+' KM';if(ev.type==='RAID_STANDING'){head=(p.raider||'RAID').toUpperCase();sub=(p.viewers||0)+' Viewer · '+Math.ceil(p.seconds||0)+'s im Stehen'}if(ev.type.startsWith('SUB_'))sub=(p.gifter||'')+(p.mode==='extended'?' · verlängert':'');if(ev.type==='RIDER_BOOST')head='+'+Math.round(p.seconds||0)+'s';if(ev.type==='BOSS_HEAL')sub=(p.user?.display_name||'')+' · +'+Math.round(p.seconds||0)+'s';qs('#eye').textContent=eye;qs('#head').textContent=head;qs('#sub').textContent=sub;qs('#callout').classList.add('on');burst(innerWidth/2,innerHeight*.42,ev.type.includes('100')||ev.type==='GOAL_COMPLETE'?120:45)}
function handleEvent(ev){if(ev.created_at&&Date.now()/1000-ev.created_at>5)return;if(ev.type==='BOSS_HIT')projectile(ev.payload);if(ev.type==='BOSS_HEAL')burst(innerWidth/2,innerHeight*.38,45);if(ev.type==='RIDER_BOOST')burst(innerWidth/2,innerHeight*.62,35)}
function projectile(p){
 lastHitAt=performance.now();if(Number.isFinite(p.hp)){qs('#hp').textContent=p.hp;qs('#hpfill').style.width=(100*p.hp/Math.max(1,p.start_hp))+'%'}
 const emotes=(p.emotes?.length?p.emotes:[p.emote]).filter(e=>e?.url);if(!emotes.length)return;
 // One gameplay hit; up to 12 distinct visuals per message to bound OBS load.
 emotes.slice(0,12).forEach((emote,i)=>setTimeout(()=>{
 const img=document.createElement('img');img.className='projectile';img.src=emote.url;img.alt=emote.code||'Emote';
 const x=40+Math.random()*Math.max(1,innerWidth-80),y=innerHeight+65;img.style.left=x+'px';img.style.top=y+'px';document.body.append(img);
 const r=qs('#monster').getBoundingClientRect(),targetX=r.width?r.left+r.width/2:innerWidth/2,targetY=r.height?r.top+r.height/2:innerHeight*.4;
 const dx=targetX-x-29,dy=targetY-y-29;
 img.animate([{transform:'translate(0,0) scale(1)',opacity:1},{offset:.65,transform:`translate(${dx*.65}px,${dy*.8}px) scale(1.05) rotate(${dx>0?100:-100}deg)`,opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.75) rotate(${dx>0?180:-180}deg)`,opacity:1}],{duration:680,easing:'ease-in',fill:'forwards'});
 setTimeout(()=>{img.remove();if(!qs('#boss').classList.contains('on')||(displayedFightId&&p.fight_id!==displayedFightId))return;const monster=qs('#monster');monster.classList.remove('hit');void monster.offsetWidth;monster.classList.add('hit');burst(targetX,targetY,18);setTimeout(()=>monster.classList.remove('hit'),230);if(i===0){const n=document.createElement('div');n.className='damageNumber';n.textContent='−'+p.damage;n.style.left=(targetX+35)+'px';n.style.top=(targetY-25)+'px';document.body.append(n);setTimeout(()=>n.remove(),900)}},680);
 const all=document.querySelectorAll('.projectile');if(all.length>80)all[0].remove();
 },i*55));
}

connect(renderState,handleEvent);
</script></body></html>
