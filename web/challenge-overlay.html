<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/common.css"><title>Challenge Overlay</title>
<style>
body{display:flex;align-items:flex-start;justify-content:center;padding:10px 20px}.wrap{width:min(1500px,96vw);position:relative}.card{position:relative;border-radius:20px;padding:16px 22px 14px;overflow:hidden}.top{display:flex;align-items:end;justify-content:space-between;gap:20px}.title{font-size:28px;font-weight:900;letter-spacing:.4px}.value{font-size:22px;font-weight:800}.meta{display:flex;gap:20px;font-size:14px;color:var(--muted);white-space:nowrap}.track{position:relative;height:34px;margin-top:12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);overflow:visible}.fill{height:100%;border-radius:17px;background:linear-gradient(90deg,#2fa7ff,#5b70ff,#8f5fff);box-shadow:0 0 24px rgba(89,216,255,.25);transition:width .7s ease,filter .5s ease}.heat1 .fill{filter:brightness(1.14);box-shadow:0 0 30px rgba(89,216,255,.5)}.heat2 .fill{filter:brightness(1.3) saturate(1.35);box-shadow:0 0 38px rgba(176,116,255,.55)}.heat3 .fill{filter:brightness(1.5) saturate(1.7);box-shadow:0 0 46px rgba(255,159,67,.7)}
.marker{position:absolute;top:-5px;width:2px;height:44px;background:rgba(255,255,255,.46);transform:translateX(-1px)}.marker::after{content:attr(data-label);position:absolute;top:45px;left:50%;transform:translateX(-50%);font-size:10px;color:#9cadc5}.inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;text-shadow:0 2px 8px #000}.stats{margin-top:23px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{min-width:0}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.plan.behind b{color:var(--orange)}.plan.ahead b{color:var(--green)}
.challenge{margin-top:10px;border-radius:12px;padding:9px 12px;background:rgba(4,8,14,.6);border:1px solid var(--line);display:none}.challenge.on{display:block}.challengeHead{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.challengeTrack{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}.challengeFill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .2s linear}.sim{position:absolute;right:12px;top:10px;font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#ff9f43;color:#111;display:none}.sim.on{display:block}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{--heat:0;--boil-time:4s;background:linear-gradient(125deg,rgba(190,20,25,calc(var(--heat)*.7)),rgba(70,4,16,calc(var(--heat)*.8))),rgba(11,18,31,.86);transition:background 1s,box-shadow 1s;box-shadow:0 0 30px rgba(255,45,20,calc(var(--heat)*.45))}.card::before{content:'';position:absolute;inset:-45%;pointer-events:none;opacity:calc(var(--heat)*.65);background:radial-gradient(ellipse at 35% 75%,#ff822e 0,transparent 32%),radial-gradient(ellipse at 70% 60%,#dc1024 0,transparent 36%);filter:blur(22px);animation:boil var(--boil-time) ease-in-out infinite alternate}.card>.top,.card>.track,.card>.stats,.card>.challenge{position:relative;z-index:1}.card canvas{z-index:0}@keyframes boil{0%{transform:translate(-3%,5%) scale(1) rotate(-7deg)}100%{transform:translate(5%,-5%) scale(1.12) rotate(8deg)}}@media(prefers-reduced-motion:reduce){.card::before{animation:none}}
</style></head><body><div class="wrap"><div id="card" class="card glass"><canvas id="fx"></canvas><div id="sim" class="sim">SIMULATION</div><div class="top"><div><div id="title" class="title">1000 km im Oktober</div><div class="meta"><span>Heute <b id="today">0.0 km</b></span><span id="planText">Plan ±0.0 km</span><span>Noch <b id="remaining">1000.0 km</b></span><span>Ø nötig <b id="needed">32.3 km/Tag</b></span></div></div><div class="value"><span id="total">0.0</span> / <span id="target">1000</span> km</div></div><div class="track" id="track"><div id="fill" class="fill" style="width:0%"></div><div id="inside" class="inside">0.0 %</div><div id="markers"></div></div><div class="stats"><div class="stat"><span>Status</span><b id="status">ON TRACK</b></div><div class="stat"><span>Nächste 10 km</span><b id="next10">10 km</b></div><div class="stat"><span>Nächste 100 km</span><b id="next100">100 km</b></div><div class="stat"><span>Speed</span><b id="speed">0.0 km/h</b></div><div class="stat"><span>Power / Cadence</span><b><span id="power">0</span> W · <span id="cad">0</span> rpm</b></div></div><div id="challenge" class="challenge"><div class="challengeHead"><span id="chLabel">SPRINT</span><span id="chTime">30s</span></div><div class="challengeTrack"><div id="chFill" class="challengeFill" style="width:100%"></div></div></div></div></div>
<script type="module">
import{connect,fmt,qs}from'/static/common.js';
let particles=[],last=performance.now(),latest=null;const canvas=qs('#fx'),ctx=canvas.getContext('2d');
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);const lvl=latest?.heat_level||0;const heat=latest?.features?.speed_heat===false?0:Math.max(0,Math.min(1,((latest?.telemetry?.speed||0)-(latest?.heat?.level1_kmh||30)+10)/((latest?.heat?.level3_kmh||40)-(latest?.heat?.level1_kmh||30)+10)));const enabled=latest?.features?.particles!==false;const target=enabled?[10,24,42,70][lvl]:0;while(particles.length<target)particles.push({x:Math.random()*r.width,y:62+Math.random()*45,v:25+Math.random()*70,a:.15+Math.random()*.55,s:1+Math.random()*2});while(particles.length>target)particles.pop();for(const p of particles){p.x+=p.v*(1+heat*3)*dt;p.y-=heat*p.v*dt;if(p.y<0)p.y=r.height;if(p.x>r.width){p.x=-5;p.y=62+Math.random()*45}ctx.globalAlpha=p.a;ctx.fillStyle=heat>.7?'#ffb35b':heat>.3?'#ff5964':'#65dcff';ctx.fillRect(p.x,p.y,p.s*2,p.s)}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
function update(s){latest=s;const c=s.challenge,t=s.telemetry||{},plan=c.plan;qs('#card').className='card glass heat'+(s.heat_level||0);const heat=s.features?.speed_heat===false?0:Math.max(0,Math.min(1,(Number(t.speed||0)-s.heat.level1_kmh+10)/(s.heat.level3_kmh-s.heat.level1_kmh+10)));qs('#card').style.setProperty('--heat',heat.toFixed(3));qs('#card').style.setProperty('--boil-time',(5-heat*4)+'s');qs('#sim').classList.toggle('on',!!s.simulation);qs('#title').textContent=c.title;qs('#total').textContent=fmt(c.total_km);qs('#target').textContent=fmt(c.target_km,0);qs('#inside').textContent=fmt(c.percent)+' %';qs('#fill').style.width=Math.min(100,c.percent)+'%';qs('#today').textContent=fmt(c.today_km)+' km';qs('#remaining').textContent=fmt(c.remaining_km)+' km';qs('#needed').textContent=plan.needed_daily_avg_km==null?'–':fmt(plan.needed_daily_avg_km)+' km/Tag';const d=Number(plan.ahead_behind_km);qs('#planText').textContent=(d>=0?'Vorsprung ':'Rückstand ')+fmt(Math.abs(d))+' km';qs('#status').textContent=plan.status.replace('_',' ').toUpperCase();qs('#status').parentElement.className='stat plan '+plan.status;qs('#next10').textContent=c.next_10_km+' km';qs('#next100').textContent=c.next_100_km+' km';qs('#speed').textContent=fmt(t.speed)+' km/h';qs('#power').textContent=fmt(t.power,0);qs('#cad').textContent=fmt(t.cadence,0);
const markers=qs('#markers');if(!markers.dataset.done){markers.innerHTML='';for(const m of c.major_markers||[]){const e=document.createElement('div');e.className='marker';e.style.left=(m/c.target_km*100)+'%';e.dataset.label=m;markers.append(e)}markers.dataset.done='1'}
const p=s.physical?.active,ch=qs('#challenge');if(p){ch.classList.add('on');qs('#chLabel').textContent=p.label+(p.grade_percent!=null?' · '+p.grade_percent+'%':'');qs('#chTime').textContent=Math.ceil(p.remaining_s)+'s';qs('#chFill').style.width=Math.max(0,Math.min(100,p.remaining_s/p.duration_s*100))+'%'}else ch.classList.remove('on');
qs('#card').style.display=s.features?.challenge_progressbar===false?'none':'block';}
connect(update,()=>{});
</script></body></html>
