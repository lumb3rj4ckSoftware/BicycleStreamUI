<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/common.css"><title>Bicycle Dashboard</title><style>
body{display:flex;align-items:center;justify-content:center;padding:18px}.dash{width:min(620px,96vw);border-radius:24px;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:18px;font-weight:900;letter-spacing:2px}.live{font-size:11px;color:var(--green)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.tile{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;padding:16px}.hero{grid-row:span 2}.label{text-transform:uppercase;color:var(--muted);font-size:11px;letter-spacing:1.2px}.big{font-size:60px;font-weight:950;line-height:1;margin-top:9px}.unit{font-size:18px;color:var(--muted);font-weight:700}.num{font-size:32px;font-weight:900;margin-top:7px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.zone{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}.zone>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .3s}.sim{font-size:10px;background:var(--orange);color:#111;padding:3px 7px;border-radius:999px;display:none}.sim.on{display:inline-block}
</style></head><body><section id="dash" class="dash glass"><div class="head"><div class="brand">STEIN // CYCLING</div><div><span id="sim" class="sim">SIM</span> <span class="live">● LIVE</span></div></div><div class="grid"><div class="tile hero"><div class="label">Speed</div><div class="big mono"><span id="speed">0.0</span><span class="unit"> km/h</span></div><div class="zone"><i id="speedZone" style="width:0%"></i></div><div class="label" style="margin-top:18px">Ø Speed</div><div class="num mono"><span id="avgspeed">0.0</span><span class="unit"> km/h</span></div></div><div class="tile"><div class="label">Power</div><div class="num mono"><span id="power">0</span><span class="unit"> W</span></div><div class="zone"><i id="powerZone" style="width:0%"></i></div></div><div class="tile"><div class="label">Heart Rate</div><div class="num mono"><span id="hr">0</span><span class="unit"> bpm</span></div><div class="zone"><i id="hrZone" style="width:0%"></i></div></div></div><div class="row"><div class="tile"><div class="label">Distance</div><div class="num mono"><span id="dist">0.00</span><span class="unit"> km</span></div></div><div class="tile"><div class="label">Cadence</div><div class="num mono"><span id="cad">0</span><span class="unit"> rpm</span></div></div><div class="tile"><div class="label">Ø Power</div><div class="num mono"><span id="avgpower">0</span><span class="unit"> W</span></div></div></div></section><script type="module">import{connect,fmt,qs}from'/static/common.js';connect(s=>{const t=s.telemetry||{};qs('#dash').style.display=s.features?.classic_dashboard===false?'none':'block';qs('#sim').classList.toggle('on',!!s.simulation);for(const [id,key,d] of [['speed','speed',1],['avgspeed','avgspeed',1],['power','power',0],['hr','heartrate',0],['dist','distance',2],['cad','cadence',0],['avgpower','avgpower',0]])qs('#'+id).textContent=fmt(t[key],d);qs('#speedZone').style.width=Math.min(100,(t.speed||0)/50*100)+'%';qs('#powerZone').style.width=Math.min(100,(t.power||0)/800*100)+'%';qs('#hrZone').style.width=Math.min(100,(t.heartrate||0)/200*100)+'%';},()=>{});</script></body></html>
